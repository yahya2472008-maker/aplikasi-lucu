<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kejutan Kecil Buat Kamu 🧸</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  --bg1:#ffe3ec;--bg2:#ffd0e0;--card:#fffafc;--ink:#4a2433;--soft:#9a6577;--pink:#ff5c8f;--pink2:#ff9ebb;--line:#ffc6d8;--fur:#c58a5e;--muzzle:#f3d3b3;--bubble:#ffffff;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg1:#2a1220;--bg2:#3d1830;--card:#38202e;--ink:#ffe6ee;--soft:#e0a6bb;--pink:#ff7ba6;--pink2:#c94d78;--line:#5a2f42;--bubble:#4a2a3b;color-scheme:dark}
}
:root[data-theme="dark"]{--bg1:#2a1220;--bg2:#3d1830;--card:#38202e;--ink:#ffe6ee;--soft:#e0a6bb;--pink:#ff7ba6;--pink2:#c94d78;--line:#5a2f42;--bubble:#4a2a3b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--ink);font-family:"Fredoka","Nunito","Segoe UI",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px;overflow-x:hidden}
.bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.bg span{position:absolute;bottom:-40px;opacity:.5;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-110vh) rotate(40deg);opacity:0}}
.card{position:relative;z-index:1;background:var(--card);border:3px solid var(--line);border-radius:32px;padding:24px 20px 26px;max-width:410px;width:100%;text-align:center;box-shadow:0 18px 50px rgba(255,92,143,.22);animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.85) translateY(20px);opacity:0}}
.hide{display:none!important}
h1{font-size:27px;margin:6px 0;line-height:1.2}
p{color:var(--soft);font-size:17px;line-height:1.5;margin:6px 0}
.bear{width:150px;height:auto;display:block;margin:0 auto;animation:bob 2.6s ease-in-out infinite;overflow:visible}
@keyframes bob{50%{transform:translateY(-7px) rotate(2deg)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.heart{transform-box:fill-box;transform-origin:center;animation:beat 1.1s infinite}
@keyframes beat{50%{transform:scale(1.18)}}
.tear,.sadm{display:none}
.sad .tear,.sad .sadm{display:block}.sad .happym{display:none}
.tear{animation:drip 1.2s infinite}
@keyframes drip{0%{transform:translateY(-4px);opacity:0}30%{opacity:1}100%{transform:translateY(18px);opacity:0}}
.bubble{background:var(--bubble);border:2.5px solid var(--line);border-radius:22px;padding:16px 16px;margin:10px 0 0;min-height:104px;display:flex;align-items:center;justify-content:center;font-size:19px;line-height:1.45;position:relative;font-weight:500}
.bubble::before{content:"";position:absolute;top:-10px;left:50%;margin-left:-9px;width:16px;height:16px;background:var(--bubble);border-left:2.5px solid var(--line);border-top:2.5px solid var(--line);transform:rotate(45deg)}
.bar{height:8px;background:var(--line);border-radius:9px;margin:16px 6px 0;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink2),var(--pink));border-radius:9px;transition:width .4s}
label{display:block;text-align:left;font-weight:600;font-size:14px;margin:12px 0 4px;color:var(--soft)}
input[type=text],textarea{width:100%;padding:12px 14px;border-radius:16px;border:2.5px solid var(--line);background:var(--bubble);color:var(--ink);font:inherit;font-size:16px}
textarea{resize:none;height:66px}
input:focus,textarea:focus{outline:none;border-color:var(--pink)}
input[type=file]{width:100%;font:inherit;font-size:14px;color:var(--soft)}
button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:14px 28px;font-size:18px;cursor:pointer;transition:transform .15s}
.btn{background:linear-gradient(180deg,var(--pink2),var(--pink));color:#fff;margin-top:18px;box-shadow:0 6px 0 rgba(180,40,90,.35)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(180,40,90,.35)}
.row{display:flex;gap:14px;justify-content:center;align-items:center;margin-top:18px;min-height:96px;flex-wrap:wrap}
#yes{background:linear-gradient(180deg,var(--pink2),var(--pink));color:#fff;box-shadow:0 6px 0 rgba(180,40,90,.35);transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
#no{background:var(--line);color:var(--ink)}
#no.run{position:fixed;z-index:20;transition:left .25s,top .25s}
.small{font-size:14px;min-height:20px;margin-top:6px}
.fall{position:fixed;top:-50px;z-index:30;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(420deg)}}
.polaroid{background:#fff;padding:10px 10px 28px;border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.2);transform:rotate(-3deg);width:190px;margin:10px auto;position:relative}
.polaroid img{width:100%;height:170px;object-fit:cover;display:block;border-radius:3px}
.polaroid b{position:absolute;bottom:4px;left:0;right:0;font-size:14px;color:#9a4565}
.stamp{display:inline-block;border:3px solid var(--pink);color:var(--pink);border-radius:12px;padding:4px 14px;font-weight:700;font-size:20px;transform:rotate(-6deg);margin:8px 0;letter-spacing:1px}
.tools{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:40;display:flex;gap:8px}
.tools button{padding:8px 12px;font-size:18px;background:var(--card);border:2px solid var(--line);box-shadow:none}
</style>
</head>
<body>
<div class="bg" id="bg"></div>
<div class="tools"><button id="snd" aria-label="Suara">🔊</button></div>

<div class="card hide" id="setup">
  <div id="b0"></div>
  <h1>Buat Kejutanmu 💌</h1>
  <p>Isi dulu, lalu tunjukkan layarnya ke dia ya</p>
  <label for="me">Namamu</label>
  <input type="text" id="me" placeholder="contoh: Budi" maxlength="24">
  <label for="ex">Nama dia</label>
  <input type="text" id="ex" placeholder="contoh: Sari" maxlength="24">
  <label for="note">Pesan dari hati (opsional)</label>
  <textarea id="note" placeholder="contoh: Aku sudah belajar dari kesalahan dan aku janji lebih baik." maxlength="140"></textarea>
  <button class="btn" id="go">Mulai ✨</button>
</div>

<div class="card" id="intro">
  <div id="b4"></div>
  <h1>Surat Rahasia 💌</h1>
  <p>Khusus untuk <b>Caca</b>. Isinya penting, lucu, dan ada kejutannya.</p>
  <button class="btn" id="open">Buka surat 💌</button>
  <p class="small">Nyalakan suara untuk pengalaman terbaik 🔊</p>
</div>

<div class="card hide" id="story">
  <div id="b1"></div>
  <div class="bubble" id="txt"></div>
  <div class="bar"><i id="prog"></i></div>
  <button class="btn" id="next">Lanjut 👉</button>
</div>

<div class="card hide" id="ask">
  <div id="b2"></div>
  <h1 id="q"></h1>
  <div class="row">
    <button id="yes">Ya, mau! 💖</button>
    <button id="no">Tidak 🙄</button>
  </div>
  <p class="small" id="hint"></p>
</div>

<div class="card hide" id="done">
  <div id="b3"></div>
  <h1 id="dt"></h1>
  <div class="stamp">RESMI BALIKAN</div>
  <p id="dp"></p>
  <p>Screenshot layar ini sebagai bukti sah 📸😆</p>
</div>

<script>
const $ = id => document.getElementById(id);
let me="Yaya", ex="Caca", note="", step=0, tries=0, steps=[], typing=null, full="", sound=true, ac;

const bearSVG = `<svg class="bear" viewBox="0 0 160 178" aria-hidden="true">
<circle cx="38" cy="40" r="17" fill="var(--fur)"/><circle cx="38" cy="40" r="9" fill="#ffb6c9"/>
<circle cx="122" cy="40" r="17" fill="var(--fur)"/><circle cx="122" cy="40" r="9" fill="#ffb6c9"/>
<circle cx="80" cy="82" r="50" fill="var(--fur)"/>
<ellipse cx="80" cy="98" rx="22" ry="16" fill="var(--muzzle)"/>
<ellipse cx="80" cy="91" rx="7" ry="5" fill="#4a2433"/>
<ellipse class="eye" cx="60" cy="74" rx="5.5" ry="6.5" fill="#4a2433"/><circle cx="62" cy="72" r="1.8" fill="#fff"/>
<ellipse class="eye" cx="100" cy="74" rx="5.5" ry="6.5" fill="#4a2433"/><circle cx="102" cy="72" r="1.8" fill="#fff"/>
<ellipse cx="46" cy="90" rx="9" ry="5.5" fill="#ff8fb0" opacity=".55"/><ellipse cx="114" cy="90" rx="9" ry="5.5" fill="#ff8fb0" opacity=".55"/>
<path class="happym" d="M71 101 Q80 111 89 101" stroke="#4a2433" stroke-width="3" fill="none" stroke-linecap="round"/>
<path class="sadm" d="M71 108 Q80 99 89 108" stroke="#4a2433" stroke-width="3" fill="none" stroke-linecap="round"/>
<path class="tear" d="M58 84 q-5 9 0 12 q5 -3 0 -12z" fill="#7cc4ff"/><path class="tear" style="animation-delay:.5s" d="M102 84 q-5 9 0 12 q5 -3 0 -12z" fill="#7cc4ff"/>
<circle cx="42" cy="140" r="14" fill="var(--fur)"/><circle cx="118" cy="140" r="14" fill="var(--fur)"/>
<path class="heart" d="M80 172 C54 154 54 132 68 132 C75 132 80 137 80 142 C80 137 85 132 92 132 C106 132 106 154 80 172Z" fill="#ff4f86"/>
</svg>`;
["b0","b1","b2","b3","b4"].forEach(id => $(id).innerHTML = bearSVG);
const setMood = (sad) => document.querySelectorAll(".bear").forEach(b => b.classList.toggle("sad", sad));

// floating hearts background
(function(){
  const e = ["💗","💕","🌸","✨","💖","🧸"], bg = $("bg");
  for(let i=0;i<16;i++){
    const s = document.createElement("span");
    s.textContent = e[i % e.length];
    s.style.left = Math.random()*100 + "vw";
    s.style.fontSize = (14 + Math.random()*22) + "px";
    s.style.animationDuration = (9 + Math.random()*10) + "s";
    s.style.animationDelay = (-Math.random()*14) + "s";
    bg.appendChild(s);
  }
})();

// sound
function tone(f, d=.12, t=0){
  if(!sound) return;
  try{
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain(), n = ac.currentTime + t;
    o.type = "sine"; o.frequency.value = f;
    g.gain.setValueAtTime(.15, n); g.gain.exponentialRampToValueAtTime(.001, n + d);
    o.connect(g); g.connect(ac.destination); o.start(n); o.stop(n + d);
  }catch(e){}
}
$("snd").onclick = () => { sound = !sound; $("snd").textContent = sound ? "🔊" : "🔇"; };

function show(id){
  ["setup","intro","story","ask","done"].forEach(x => $(x).classList.toggle("hide", x !== id));
  window.scrollTo(0,0);
}

function typeText(t){
  clearInterval(typing); full = t; const el = $("txt"); el.textContent = ""; let i = 0;
  typing = setInterval(() => {
    el.textContent = t.slice(0, ++i);
    if(i % 3 === 0) tone(700 + Math.random()*300, .03);
    if(i >= t.length){ clearInterval(typing); typing = null; }
  }, 32);
}

function build(){
  steps = [
    ["Psst, " + ex + "... 🤫 Ini surat cinta rahasia. Kalau kamu bukan Caca, tolong tutup matanya ya.", 0],
    ["Halo Caca! 👋 Aku beruang kecil utusan " + me + ". Gajiku cuma sebungkus madu, tapi misiku penting banget.", 0],
    ["Laporan dari lapangan: sejak kalian pisah, kuota " + me + " habis cuma buat lihat story kamu. 📉", 1],
    ["Mi instan pun sudah bosan sama " + me + ". Nggak ada yang nemenin cari makan malam. 🍜", 1],
    ["Sekarang bagian yang serius ya. " + me + " bilang: “Aku sayang dan cinta banget sama kamu, " + ex + ".” 💗", 0],
    ["“Aku minta maaf untuk semua kesalahan yang pernah aku buat. Tolong maafkan aku ya.” 🥺", 1],
    ["“Aku janji akan berubah jadi lebih baik, dan aku mau buktikan lewat tindakan, bukan cuma kata-kata.” 🌱", 0],
    ["Jadi, setelah pertimbangan matang dan satu gelas teh manis... 💘", 0]
  ];
  step = 0; render();
}
function render(){
  setMood(steps[step][1] === 1);
  typeText(steps[step][0]);
  $("prog").style.width = ((step + 1) / steps.length * 100) + "%";
  $("next").textContent = step === steps.length - 1 ? "Aku siap dengar 🥹" : "Lanjut 👉";
}

$("go").onclick = () => {
  me = $("me").value.trim(); ex = $("ex").value.trim(); note = $("note").value.trim();
  if(!me || !ex){ alert("Isi nama kamu dan nama dia dulu ya 😊"); return; }
  tone(523); tone(659, .12, .1);
  show("story"); build();
};

$("open").onclick = () => { tone(523); tone(659, .12, .1); show("story"); build(); };

document.addEventListener("click", e => {
  if(!e.target.closest(".bear")) return;
  tone(880, .1);
  const h = document.createElement("div");
  h.className = "fall"; h.textContent = "💗";
  h.style.left = e.clientX + "px"; h.style.top = e.clientY + "px"; h.style.animationDuration = "1.6s";
  document.body.appendChild(h); setTimeout(() => h.remove(), 1700);
});

$("next").onclick = () => {
  if(typing){ clearInterval(typing); typing = null; $("txt").textContent = full; return; }
  tone(600, .08);
  if(step < steps.length - 1){ step++; render(); }
  else { setMood(false); $("q").textContent = ex + ", maukah kamu maafin " + me + " dan balikan?"; show("ask"); }
};

const noTexts = ["Tidak 🙄","Yakin? 🥺","Coba pikir lagi 😢","Jangan gitu dong 💔","Tombol ini rusak lho 🔧","Hehe, nggak bisa 😜","Ya aja deh? 🥹","Dia menyerah... 🏳️"];
function runAway(e){
  if(e) e.preventDefault();
  tries++; tone(260, .15); setMood(true);
  const b = $("no");
  if(tries >= 9){
    b.classList.add("hide");
    $("hint").textContent = "Tombol “Tidak” mengundurkan diri. Tinggal satu pilihan 😏";
    return;
  }
  b.classList.add("run");
  b.textContent = noTexts[Math.min(tries, noTexts.length - 1)];
  const w = b.offsetWidth, h = b.offsetHeight;
  b.style.left = Math.max(8, Math.random() * (window.innerWidth - w - 16)) + "px";
  b.style.top = Math.max(60, Math.random() * (window.innerHeight - h - 16)) + "px";
  const s = Math.min(1 + tries * 0.17, 2.1);
  $("yes").style.transform = "scale(" + s + ")";
  $("yes").style.margin = (s * 9) + "px";
  $("hint").textContent = tries > 3 ? "Tombol “Ya” makin besar, lho. Itu pertanda 😏" : "";
}
["mouseover","touchstart","click"].forEach(ev => $("no").addEventListener(ev, runAway, {passive:false}));

$("yes").onclick = () => {
  $("no").classList.add("hide"); setMood(false);
  $("dt").textContent = "YEAAAY! 🎉";
  $("dp").textContent = me + " & " + ex + " resmi balikan! Bonus kupon sah: 🎟️ 1x traktir makan, 1x peluk hangat, dan 1x anti telat bales chat.";
  show("done");
  [523,659,784,1047,1319].forEach((f,i) => tone(f, .25, i*.12));
  const e = ["💖","🎉","🧸","✨","💘","🌸","🥳","💗"];
  for(let i=0;i<70;i++){
    const f = document.createElement("div");
    f.className = "fall"; f.textContent = e[i % e.length];
    f.style.left = Math.random()*100 + "vw";
    f.style.fontSize = (20 + Math.random()*24) + "px";
    f.style.animationDuration = (2.2 + Math.random()*3) + "s";
    f.style.animationDelay = Math.random()*1.8 + "s";
    document.body.appendChild(f);
    setTimeout(() => f.remove(), 8000);
  }
};
</script>
</body>
</html>
